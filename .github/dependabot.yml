version: 2
updates:
  # Um PR por mês para todo o npm (raiz e workspaces), separando majors.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-menores:
        update-types: [minor, patch]
      npm-majors:
        update-types: [major]

  - package-ecosystem: pip
    directory: /motor
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      pip:
        patterns: ['*']

