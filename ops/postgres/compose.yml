# Postgres da Margem em container (desenvolvimento). Segredos em ~/.config/margem/postgres.env (fora do repo).
name: margem
#   docker compose -f ops/postgres/compose.yml --env-file ~/.config/margem/postgres.env up -d
services:
  postgres:
    image: postgres:18-alpine
    container_name: margem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${MARGEM_PG_PORT}:5432"
    volumes:
      - margem-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  margem-pgdata:
